# بناء APK آلياً على GitHub Actions — نفس أسلوب مشروع finacc-flutter2
# المرجعي: كل tag يبني APK موقّعاً debug ويرفقه بإصدار GitHub Release.
# القرص المحدود في sandbox لا يستوعب بناء Gradle الكامل، لذا البناء في CI.
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # مثبّت عمداً (ubuntu-latest قد يتحول إلى Ubuntu 26 في 2026-10-19
    # وكسر سلسلة الأدوات فجأة — نفس قرار finacc-flutter2).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze gate
        run: flutter analyze

      - name: Test gate
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hs-ride-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
